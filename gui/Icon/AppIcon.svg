<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>VPN Kill Switch</title>
  <defs>
    <clipPath id="inner">
      <rect x="34.0" y="34.0" width="956.0" height="956.0" rx="207.52" ry="207.52"/>
    </clipPath>
    <radialGradient id="button" cx="38%" cy="30%" r="78%">
      <stop offset="0%"  stop-color="#F0705A"/>
      <stop offset="55%" stop-color="#E04B33"/>
      <stop offset="100%" stop-color="#C23A22"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9A85" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8E2716" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- light frame -->
  <rect x="0" y="0" width="1024" height="1024" rx="232.0" ry="232.0" fill="#F5F4F1"/>

  <!-- hazard stripes -->
  <g clip-path="url(#inner)">
    <rect x="0" y="0" width="1024" height="1024" fill="#3A312A"/>
    <g transform="rotate(-45 512.0 512.0)">
      <rect x="-1500.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="-1236.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="-972.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="-708.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="-444.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="-180.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="84.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="348.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="612.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="876.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="1140.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
      <rect x="1404.0" y="-1500" width="132.0" height="3000" fill="#F0C13C"/>
    </g>
  </g>

  <!-- emergency button -->
  <g filter="url(#drop)">
    <circle cx="512.0" cy="512.0" r="286" fill="url(#rim)"/>
    <circle cx="512.0" cy="512.0" r="270" fill="url(#button)"/>
  </g>

  <!-- reset glyph -->
  <g fill="#A32E1B" stroke="#A32E1B" stroke-width="64.0" stroke-linecap="butt">
    <path d="M 370.6 446.1 A 156.0 156.0 0 0 1 653.4 446.1" fill="none"/>
    <path d="M 653.4 577.9 A 156.0 156.0 0 0 1 370.6 577.9" fill="none"/>
    <path d="M 694.0 533.1 L 709.6 419.9 L 597.2 472.3 Z" stroke="none"/>
    <path d="M 330.0 490.9 L 314.4 604.1 L 426.8 551.7 Z" stroke="none"/>
  </g>
</svg>
